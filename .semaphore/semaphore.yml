version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Job
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - checkout
            - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
